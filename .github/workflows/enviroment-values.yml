name: access env variables

on:
  push:
    branches:
      - main

jobs:
  demo-env:
    runs-on: ubuntu-latest
    environment: dev 

    env:
      WORKFLOW_VERSION: "1.0.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Org / Repo Variable
        run: |
          echo "Company is ${{ vars.COMPANY_NAME }}"

      - name: Display Environment Variables
        run: |
          echo "Owner: ${{ vars.OWNER }}"
          echo "Environment: ${{ vars.ENV_NAME }}"

      - name: Display Repository Variable
        run: |
          echo "Mentor name is ${{ vars.MENTOR }}"

      - name: Display Workflow Runtime Variable
        run: |
          echo "Workflow version is $WORKFLOW_VERSION"
