name: Two Stages Example

on:
  workflow_dispatch

jobs:
  # -------- STAGE 1 --------
  ci:
    runs-on: ubuntu-latest
    steps:
      # Step 1
      - name: Build
        run: echo "Building application"

      # Step 2
      - name: Test
        run: echo "Running tests"

  # -------- STAGE 2 --------
  cd:
    runs-on: ubuntu-latest
    needs: ci   # 👈 this makes it Stage 2

    steps:
      # Step 1
      - name: Deploy
        run: echo "Deploying application"

      # Step 2
      - name: Verify
        run: echo "Deployment verified"
