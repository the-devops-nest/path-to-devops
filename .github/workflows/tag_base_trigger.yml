name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Print tag name
        run: echo "Release tag is $GITHUB_REF_NAME"

      - name: Build artifact
        run: echo "Building release for $GITHUB_REF_NAME"

      - name: Deploy
        run: echo "Deploying version $GITHUB_REF_NAME"
