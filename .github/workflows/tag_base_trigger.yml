name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Extract release tag
        id: tag
        run: |
          echo "release_tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # 2️⃣ STEP 2: Use output in build step
      - name: Build artifact
        run: |
          echo "Building release for version ${{ steps.tag.outputs.release_tag }}"

      # 3️⃣ STEP 3: Use SAME output in deploy step
      - name: Deploy
        run: |
          echo "Deploying version ${{ steps.tag.outputs.release_tag }}"
