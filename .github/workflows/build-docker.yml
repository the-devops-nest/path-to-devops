name: CI Demo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check Python version
        run: python --version
      - name: Run Python script
        run: print("Python setup completed")
        shell: python

      # 4️⃣ Setup Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Check Java version
        run: java -version
      - name: Run build
        run: echo "Build completed"
      - name: run java script
        run: system.out.println("Java setup completed");
        shell: java
