name: CI Demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEMO_ENV: 'GitHub Actions to DevOps'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check Python version
        run: python --version
      - name: Run Python script
        id: run_python
        run: echo "Python setup completed"

      # 4️⃣ Setup Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Check Java version
        run: java -version
      - name: Run build
        run: echo "Build completed"
      - name: run java script
        id: run_java
        run: echo "Java setup completed"

      - name: Final step (depends on Python & Java)
        if: ${{ steps.run_python.outcome == 'success' && steps.run_java.outcome == 'success' }}
        run: echo "Both Python and Java setups completed"
